baseURL = "https://rivik.github.io/"
languageCode = "en-us"
title = "Ilya Rusalowski Hub"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[permalinks]
  posts = "/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowCanonicalLink = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true

[params.homeInfoParams]
  Title = "Ilya Rusalowski"
  Content = "Personal hub: originals + reposts from my projects. More on the <a href=\"/about/\">about</a> page."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/rivik"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/ilya-rusalowski/"

[[params.socialIcons]]
  name = "x"
  url = "https://x.com/IlyaRusalowski"

[[menu.main]]
  identifier = "about"
  name = "about"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "posts"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "tags"
  url = "/tags/"
  weight = 30

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
