<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
    <marker id="arrow4g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d6a4f"/>
    </marker>
  </defs>

  <rect width="820" height="340" fill="url(#bg4)" rx="8"/>

  <!-- Title area -->
  <text x="410" y="32" text-anchor="middle" font-size="11" fill="#868e96" font-weight="bold" letter-spacing="1.5">ATTACK CHAIN</text>

  <!-- Step 1: Prior breach -->
  <rect x="30" y="55" width="140" height="90" rx="6" fill="#fff" filter="url(#shadow4)" stroke="#e63946" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="#e63946" font-weight="bold">STEP 1</text>
  <text x="100" y="100" text-anchor="middle" font-size="12" fill="#212529" font-weight="bold">Prior breach</text>
  <text x="100" y="118" text-anchor="middle" font-size="10" fill="#868e96">Credentials harvested</text>
  <text x="100" y="132" text-anchor="middle" font-size="10" fill="#868e96">from old data breaches</text>

  <!-- Arrow 1->2 -->
  <line x1="175" y1="100" x2="210" y2="100" stroke="#e63946" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Step 2: Dark web -->
  <rect x="220" y="55" width="140" height="90" rx="6" fill="#fff" filter="url(#shadow4)" stroke="#e63946" stroke-width="1.5"/>
  <text x="290" y="80" text-anchor="middle" font-size="11" fill="#e63946" font-weight="bold">STEP 2</text>
  <text x="290" y="100" text-anchor="middle" font-size="12" fill="#212529" font-weight="bold">Dark web sale</text>
  <text x="290" y="118" text-anchor="middle" font-size="10" fill="#868e96">Password circulating</text>
  <text x="290" y="132" text-anchor="middle" font-size="10" fill="#868e96">for years on markets</text>

  <!-- Arrow 2->3 -->
  <line x1="365" y1="100" x2="400" y2="100" stroke="#e63946" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Step 3: No MFA -->
  <rect x="410" y="55" width="140" height="90" rx="6" fill="#fff" filter="url(#shadow4)" stroke="#e63946" stroke-width="1.5"/>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#e63946" font-weight="bold">STEP 3</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#212529" font-weight="bold">No MFA enabled</text>
  <text x="480" y="118" text-anchor="middle" font-size="10" fill="#868e96">Password alone grants</text>
  <text x="480" y="132" text-anchor="middle" font-size="10" fill="#868e96">full account access</text>

  <!-- Arrow 3->4 -->
  <line x1="555" y1="100" x2="590" y2="100" stroke="#e63946" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Step 4: Compromised -->
  <rect x="600" y="55" width="185" height="90" rx="6" fill="#e63946" filter="url(#shadow4)"/>
  <text x="692" y="80" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">RESULT</text>
  <text x="692" y="100" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">300+ emails leaked</text>
  <text x="692" y="118" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">Personal photos published</text>
  <text x="692" y="132" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">by Iran-linked hackers</text>

  <!-- Divider -->
  <line x1="60" y1="180" x2="760" y2="180" stroke="#dee2e6" stroke-width="1"/>
  <rect x="355" y="170" width="110" height="20" rx="4" fill="url(#bg4)"/>
  <text x="410" y="185" text-anchor="middle" font-size="11" fill="#2d6a4f" font-weight="bold">WITH PASSKEYS</text>

  <!-- Passkey step 1 -->
  <rect x="30" y="210" width="140" height="90" rx="6" fill="#fff" filter="url(#shadow4)" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="100" y="235" text-anchor="middle" font-size="11" fill="#2d6a4f" font-weight="bold">STEP 1</text>
  <text x="100" y="255" text-anchor="middle" font-size="12" fill="#212529" font-weight="bold">Prior breach</text>
  <text x="100" y="273" text-anchor="middle" font-size="10" fill="#868e96">No password stored</text>
  <text x="100" y="287" text-anchor="middle" font-size="10" fill="#868e96">Nothing to harvest</text>

  <!-- Arrow to blocked -->
  <line x1="175" y1="255" x2="210" y2="255" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow4g)"/>

  <!-- Blocked -->
  <rect x="220" y="210" width="180" height="90" rx="6" fill="#2d6a4f" filter="url(#shadow4)"/>
  <text x="310" y="246" text-anchor="middle" font-size="28" fill="#fff">&#x2717;</text>
  <text x="310" y="272" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">BLOCKED</text>
  <text x="310" y="290" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">No credential to steal or replay</text>

  <!-- Annotation -->
  <text x="480" y="245" font-size="11" fill="#495057" font-style="italic">Private key never leaves device.</text>
  <text x="480" y="263" font-size="11" fill="#495057" font-style="italic">No shared secret exists.</text>
  <text x="480" y="281" font-size="11" fill="#495057" font-style="italic">Phishing produces nothing usable.</text>

  <!-- Source -->
  <text x="410" y="328" text-anchor="middle" font-size="10" fill="#adb5bd" font-style="italic">FBI Director Kash Patel email compromise, March 2026</text>
</svg>