<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#bg1)" rx="8"/>

  <!-- Timeline line -->
  <line x1="80" y1="95" x2="820" y2="95" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Timeline dots -->
  <circle cx="160" cy="95" r="8" fill="#495057"/>
  <circle cx="450" cy="95" r="8" fill="#495057"/>
  <circle cx="740" cy="95" r="8" fill="#495057"/>
  <!-- Timeline labels -->
  <text x="160" y="75" text-anchor="middle" font-size="13" fill="#868e96" font-style="italic">2010 - 2015</text>
  <text x="450" y="75" text-anchor="middle" font-size="13" fill="#868e96" font-style="italic">2020 - present</text>
  <text x="740" y="75" text-anchor="middle" font-size="13" fill="#868e96" font-style="italic">emerging</text>

  <!-- Card 1: Networks -->
  <rect x="45" y="120" width="250" height="270" rx="6" fill="#fff" filter="url(#shadow1)" stroke="#dee2e6" stroke-width="1"/>
  <rect x="45" y="120" width="250" height="6" rx="6" fill="#e63946"/>
  <text x="170" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Paradigm I</text>
  <text x="170" y="182" text-anchor="middle" font-size="12" fill="#e63946" font-weight="bold" letter-spacing="1">"ALL NETWORKS ARE PUBLIC"</text>
  <line x1="75" y1="198" x2="265" y2="198" stroke="#e9ecef" stroke-width="1"/>
  <text x="170" y="224" text-anchor="middle" font-size="12" fill="#495057">Assumption:</text>
  <text x="170" y="242" text-anchor="middle" font-size="11" fill="#868e96">WiFi and networks can be trusted</text>
  <text x="170" y="274" text-anchor="middle" font-size="12" fill="#495057">Reality:</text>
  <text x="170" y="292" text-anchor="middle" font-size="11" fill="#868e96">Trivially interceptable traffic</text>
  <text x="170" y="324" text-anchor="middle" font-size="12" fill="#495057">Fix:</text>
  <rect x="105" y="334" width="130" height="30" rx="4" fill="#2d6a4f" opacity="0.9"/>
  <text x="170" y="354" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">HTTPS / TLS</text>

  <!-- Card 2: Data -->
  <rect x="325" y="120" width="250" height="270" rx="6" fill="#fff" filter="url(#shadow1)" stroke="#dee2e6" stroke-width="1"/>
  <rect x="325" y="120" width="250" height="6" rx="6" fill="#e63946"/>
  <text x="450" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Paradigm II</text>
  <text x="450" y="182" text-anchor="middle" font-size="12" fill="#e63946" font-weight="bold" letter-spacing="1">"ALL DATA IS PUBLIC"</text>
  <line x1="355" y1="198" x2="545" y2="198" stroke="#e9ecef" stroke-width="1"/>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#495057">Assumption:</text>
  <text x="450" y="242" text-anchor="middle" font-size="11" fill="#868e96">Data behind firewalls is safe</text>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#495057">Reality:</text>
  <text x="450" y="292" text-anchor="middle" font-size="11" fill="#868e96">5.5 billion accounts breached (2024)</text>
  <text x="450" y="324" text-anchor="middle" font-size="12" fill="#495057">Fix:</text>
  <rect x="375" y="334" width="150" height="30" rx="4" fill="#2d6a4f" opacity="0.9"/>
  <text x="450" y="354" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Passkeys / FIDO2</text>

  <!-- Card 3: Judgment -->
  <rect x="605" y="120" width="250" height="270" rx="6" fill="#fff" filter="url(#shadow1)" stroke="#dee2e6" stroke-width="1"/>
  <rect x="605" y="120" width="250" height="6" rx="6" fill="#457b9d"/>
  <text x="730" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Paradigm III</text>
  <text x="730" y="182" text-anchor="middle" font-size="12" fill="#457b9d" font-weight="bold" letter-spacing="1">"ALL HUMANS ERR"</text>
  <line x1="635" y1="198" x2="825" y2="198" stroke="#e9ecef" stroke-width="1"/>
  <text x="730" y="224" text-anchor="middle" font-size="12" fill="#495057">Assumption:</text>
  <text x="730" y="242" text-anchor="middle" font-size="11" fill="#868e96">Users will follow security policy</text>
  <text x="730" y="274" text-anchor="middle" font-size="12" fill="#495057">Reality:</text>
  <text x="730" y="292" text-anchor="middle" font-size="11" fill="#868e96">Signalgate, casual data spillage</text>
  <text x="730" y="324" text-anchor="middle" font-size="12" fill="#495057">Fix:</text>
  <rect x="645" y="334" width="170" height="30" rx="4" fill="#457b9d" opacity="0.9"/>
  <text x="730" y="354" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">On-Device AI DLP</text>

  <!-- Arrows between cards -->
  <path d="M300 255 L320 255" stroke="#adb5bd" stroke-width="1.5" fill="none" marker-end="url(#arrowhead1)"/>
  <path d="M580 255 L600 255" stroke="#adb5bd" stroke-width="1.5" fill="none" marker-end="url(#arrowhead1)"/>
  <defs>
    <marker id="arrowhead1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#adb5bd"/>
    </marker>
  </defs>
</svg>