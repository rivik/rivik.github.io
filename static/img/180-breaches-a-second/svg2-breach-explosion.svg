<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <linearGradient id="bar2023" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#868e96"/>
      <stop offset="100%" style="stop-color:#495057"/>
    </linearGradient>
    <linearGradient id="bar2024" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="720" height="400" fill="url(#bg2)" rx="8"/>

  <!-- Y-axis -->
  <line x1="120" y1="50" x2="120" y2="320" stroke="#ced4da" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="120" y1="320" x2="620" y2="320" stroke="#ced4da" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="110" y="324" text-anchor="end" font-size="11" fill="#868e96">0</text>
  <text x="110" y="270" text-anchor="end" font-size="11" fill="#868e96">1B</text>
  <line x1="115" y1="267" x2="620" y2="267" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="110" y="216" text-anchor="end" font-size="11" fill="#868e96">2B</text>
  <line x1="115" y1="213" x2="620" y2="213" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="110" y="162" text-anchor="end" font-size="11" fill="#868e96">3B</text>
  <line x1="115" y1="159" x2="620" y2="159" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="110" y="108" text-anchor="end" font-size="11" fill="#868e96">4B</text>
  <line x1="115" y1="105" x2="620" y2="105" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="110" y="57" text-anchor="end" font-size="11" fill="#868e96">5B</text>
  <line x1="115" y1="54" x2="620" y2="54" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Y-axis title -->
  <text x="30" y="190" text-anchor="middle" font-size="12" fill="#495057" transform="rotate(-90, 30, 190)">Accounts compromised</text>

  <!-- 2023 bar: 730M ~ height 39px from baseline 320 -->
  <rect x="220" y="281" width="100" height="39" rx="3" fill="url(#bar2023)"/>
  <text x="270" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#495057">730M</text>
  <text x="270" y="348" text-anchor="middle" font-size="14" fill="#495057">2023</text>

  <!-- 2024 bar: 5.5B ~ height 297px from baseline 320 -->
  <rect x="400" y="63" width="100" height="257" rx="3" fill="url(#bar2024)"/>
  <text x="450" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">5.5B</text>
  <text x="450" y="348" text-anchor="middle" font-size="14" fill="#495057">2024</text>

  <!-- Multiplier annotation -->
  <line x1="340" y1="300" x2="340" y2="130" stroke="#e63946" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M335 300 L340 310 L345 300" fill="#e63946"/>
  <path d="M335 130 L340 120 L345 130" fill="#e63946"/>
  <rect x="320" y="200" width="42" height="24" rx="4" fill="#e63946"/>
  <text x="341" y="217" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">~8x</text>

  <!-- Subtitle -->
  <text x="360" y="385" text-anchor="middle" font-size="11" fill="#868e96" font-style="italic">Source: Surfshark Global Data Breach Analysis, 2025</text>
</svg>